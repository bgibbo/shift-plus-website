name: Publish approved website
on:
  workflow_dispatch:
    inputs:
      approved:
        description: 'Explicit public launch authorization obtained (type PUBLISH)'
        required: true
        type: string
      base_url:
        description: 'Approved production URL, including repository path if applicable'
        required: true
        default: 'https://bgibbo.github.io/shift-plus-website/'
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.approved == 'PUBLISH'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check.py
      - name: Prepare public metadata
        env:
          SITE_URL: ${{ inputs.base_url }}
        run: python scripts/prepare_release.py "$SITE_URL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
